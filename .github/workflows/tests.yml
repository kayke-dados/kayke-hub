name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar pytest
        run: python -m pip install --upgrade pip pytest
      - name: Testes
        run: python -m pytest tests/ -q --deselect tests/test_links.py::TestLinks::test_external_anchor_urls_respond
      - name: Sintaxe do JavaScript
        run: node --check js/main.js
