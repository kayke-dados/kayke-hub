<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Kayke Hub — portfólio pessoal de Python e análise de dados</title>
  <desc id="desc">Banner com o nome Kayke Hub, a assinatura Python e análise de dados e a contagem de 87 de 87 exercícios.</desc>
  <defs>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7C5CC4"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="0%" r="70%">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="#0B0D12"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <rect x="0" y="0" width="12" height="300" fill="#A78BFA"/>

  <text x="72" y="84" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="17" letter-spacing="4.5" fill="#A78BFA">PORTFÓLIO PESSOAL · APRENDIZADO EM PÚBLICO</text>

  <text x="72" y="178" font-family="Manrope,Inter,'Segoe UI',system-ui,sans-serif" font-size="92" font-weight="800" letter-spacing="-3" fill="#F1F0F5">Kayke <tspan fill="#A78BFA">Hub</tspan></text>

  <text x="72" y="226" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="26" fill="#A1A1AA">Python · análise de dados · projetos reais</text>

  <rect x="72" y="258" width="1056" height="1" fill="#262C38"/>

  <text x="1010" y="84" text-anchor="end" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="17" letter-spacing="3" fill="#A1A1AA">PYTHON-JOURNEY</text>
  <text x="1128" y="84" text-anchor="end" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="17" fill="#A78BFA">87/87</text>

  <g transform="translate(1000 108)">
    <rect x="0"   y="96" width="16" height="44" rx="2" fill="url(#bar)"/>
    <rect x="24"  y="78" width="16" height="62" rx="2" fill="url(#bar)"/>
    <rect x="48"  y="40" width="16" height="100" rx="2" fill="url(#bar)"/>
    <rect x="72"  y="58" width="16" height="82" rx="2" fill="url(#bar)"/>
    <rect x="96"  y="118" width="16" height="22" rx="2" fill="url(#bar)"/>
    <rect x="120" y="88" width="16" height="52" rx="2" fill="url(#bar)"/>
  </g>
</svg>
